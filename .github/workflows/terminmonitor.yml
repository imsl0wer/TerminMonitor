
name: TerminMonitor

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Terminland
        run: python main.py
